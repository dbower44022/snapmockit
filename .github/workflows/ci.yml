# Continuous integration (Technical Architecture PRD 1.49; docs/Release-Engineering.md).
# Lint, format, type check, and the whole test suite on the offscreen Qt platform, on
# every push and pull request; a build of the wheel and sdist, so the packaging
# metadata is proven on every change too; the Linux AppImage built by the recipe under
# packaging/appimage/, smoke-tested on the runner and kept as an artifact (packaging
# decision 2; docs/Packaging-AppImage-Implementation.md); the Linux Flatpak built by the
# recipe under packaging/flatpak/, smoke-tested and kept the same way (Flatpak decision 2;
# docs/Packaging-Flatpak-Implementation.md); on a tag of the form vX.Y.Z, a GitHub
# release carrying both, which Check for Updates reads, and then the wheel and sdist
# uploaded to the Python Package Index once Doug approves the pypi environment's run
# (PyPI decision 1; docs/Packaging-PyPI-Implementation.md); on the same tag, once Doug
# approves the github-pages environment's run, the project's own Flatpak repository
# rebuilt with the new version and deployed to https://flatpak.snapmockit.com/
# (docs/Flatpak-Repository-Implementation.md, decisions 2 and 4); and, started by hand,
# a rehearsal of either: the upload to the test index (PyPI decision 2), or the Flatpak
# repository published under the branch "rehearsal" (Flatpak repository silence 5).
name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      rehearsal:
        description: What the run started by hand rehearses
        type: choice
        options: [testpypi, flatpak]
        default: testpypi

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Both interpreters on every push: 3.12 is what the package declares, what the
    # AppImage bundles, and what development runs on; 3.13 is what the KDE runtime
    # the Flatpak is built on carries (Flatpak decision 1; Technical Architecture
    # PRD Section 9), so the Flatpak's interpreter is never untested.
    name: Lint, types, tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Qt runtime libraries and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxcb-render-util0 libxcb-image0 \
            fonts-dejavu-core fonts-noto-color-emoji

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy snapmock

      - name: Tests
        run: >
          uv run pytest -q -o faulthandler_timeout=120 --durations=15
          --deselect tests/test_property_panel.py::test_font_combo_reflects_text_item_font

  build:
    name: Wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install
      - name: Build
        run: uv build
      - name: Show what was built
        run: ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: snapmockit-dist
          path: dist/
          if-no-files-found: error

  appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The smoke test builds the main window on the offscreen platform from the
      # bundled Python, which takes the same host libraries the suite does.
      - name: Qt runtime libraries and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxcb-render-util0 libxcb-image0 \
            fonts-dejavu-core

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install, with the packaging tools
        run: uv sync --locked --group packaging

      - name: Build the AppImage
        run: uv run --group packaging python packaging/appimage/build.py

      - name: Smoke test
        run: bash packaging/appimage/smoke.sh dist/Snapmockit-*-x86_64.AppImage

      - name: Show what was built
        run: ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: snapmockit-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  flatpak:
    # The secondary Linux form (Technical Architecture PRD 7.3; Flatpak decision 2).
    # The runtime, the SDK, and the PyQt base application come from Flathub on every
    # run: about 1.6 GB, which is the price of building the form Flathub accepts.
    name: Linux Flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The recipe renders the icon through Qt before it builds, so the runner needs
      # the same host libraries the checks job installs for PyQt6 to import; and
      # librsvg2-common, without which the export step reads the scalable icon as
      # "Format not recognized" and the build fails after everything else has passed.
      - name: Flatpak, its builder, and the Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxcb-render-util0 libxcb-image0 \
            fonts-dejavu-core librsvg2-common
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: The runtime, the SDK, and the PyQt base application
        run: |
          sudo flatpak install -y --noninteractive flathub \
            org.kde.Platform//6.11 org.kde.Sdk//6.11 \
            com.riverbankcomputing.PyQt.BaseApp//6.11

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install
        run: uv sync --locked

      - name: Build the Flatpak
        run: uv run python packaging/flatpak/build.py

      - name: Smoke test
        run: bash packaging/flatpak/smoke.sh dist/Snapmockit-*-x86_64.flatpak

      - name: Show what was built
        run: ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: snapmockit-flatpak
          path: |
            dist/*.flatpak
            dist/snapmockit.flatpakref
            dist/snapmockit.flatpakrepo
          if-no-files-found: error

      # The Flatpak repository the build left behind, for the publishing job, which
      # signs its one commit into a new Flatpak repository and builds nothing itself.
      # One file, since an OSTree repository is thousands of small ones.
      - name: Keep the Flatpak repository
        run: tar -C build/flatpak -cf build/snapmockit-flatpak-repo.tar repo

      - uses: actions/upload-artifact@v4
        with:
          name: snapmockit-flatpak-repo
          path: build/snapmockit-flatpak-repo.tar
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, build, appimage, flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The tag names the version the package carries, or the release is not made:
      # Check for Updates compares the release's tag with the running version.
      - name: The tag is the package's version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' snapmock/__init__.py)"
          echo "tag $tag, package $version"
          [ "$tag" = "v$version" ] || { echo "the tag must be v$version" >&2; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: snapmockit-appimage
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: snapmockit-flatpak
          path: dist/

      - name: Release notes from the tag's message
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
          [ -s release-notes.md ] || echo "Snapmockit ${GITHUB_REF_NAME#v}." > release-notes.md
          cat release-notes.md

      # The Flatpak bundle is not attached here: the one a release carries is built
      # from the signed Flatpak repository by publish-flatpak, once Doug approves it,
      # since a bundle that carries the key installs only when its commit is signed
      # (Flatpak repository decision 6). The flatpak job's own bundle is unsigned.
      - name: Publish the release with the AppImage and the Flatpak's reference files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/Snapmockit-*-x86_64.AppImage \
            dist/snapmockit.flatpakref \
            dist/snapmockit.flatpakrepo \
            --title "Snapmockit ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag

  # The index's trusted publishing: no token exists anywhere. The job only downloads
  # what the build job made and uploads it, since the Python Packaging User Guide calls
  # building in a publishing job unsupported; the pypi environment requires Doug's
  # approval on each run and admits only v*.*.* tags (PyPI decision 1).
  publish-pypi:
    name: Python Package Index
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/snapmockit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snapmockit-dist
          path: dist/

      - name: Show what is uploaded
        run: ls -l dist/

      - name: Upload to the Python Package Index
        uses: pypa/gh-action-pypi-publish@release/v1

  # The rehearsal on the test index, started by hand from the Actions tab on a branch
  # whose version is a release candidate (PyPI decision 2). It never runs on a tag.
  publish-testpypi:
    name: Test index (rehearsal)
    if: github.event_name == 'workflow_dispatch' && inputs.rehearsal == 'testpypi'
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/snapmockit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snapmockit-dist
          path: dist/

      - name: Show what is uploaded
        run: ls -l dist/

      - name: Upload to the test index
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # The project's own Flatpak repository (docs/Flatpak-Repository-Implementation.md). The
  # whole site is rebuilt from nothing on every publish (decision 2): the flatpak job's
  # commit, signed with the key in the FLATPAK_GPG_PRIVATE_KEY secret (decision 3), the
  # summary and AppStream data, and the two reference files the release carries. On a
  # release tag it publishes into stable once the release exists, and attaches to the
  # release the bundle it builds from the signed Flatpak repository (decision 6);
  # started by hand with the rehearsal input "flatpak", it publishes into the branch
  # rehearsal and attaches nothing (silence 5). Either way the github-pages
  # environment waits for Doug's approval (decision 4). Like the index's job, it
  # downloads what another job built and compiles nothing itself.
  publish-flatpak:
    name: Flatpak repository
    if: >-
      !cancelled() && needs.flatpak.result == 'success' &&
      ((startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.rehearsal == 'flatpak'))
    needs: [flatpak, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak

      - uses: actions/download-artifact@v4
        with:
          name: snapmockit-flatpak
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: snapmockit-flatpak-repo
          path: build/

      - name: Unpack the Flatpak repository
        run: tar -C build -xf build/snapmockit-flatpak-repo.tar

      # The key goes from the secret into a keyring of this run's own and is never
      # written to a file or printed.
      - name: The signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          gpg --list-secret-keys --with-colons | grep -q DF8F47BD1CCF5D535B7F2986BC563E79934E4F6C
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      # The signed bundle takes the unsigned one's name, which the version is read from.
      - name: Build the site and the signed bundle
        run: >
          python3 packaging/flatpak/publish.py
          --source build/repo --site site --references dist
          --branch ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'rehearsal' }}
          --gpg-homedir "$GNUPGHOME"
          --bundle "signed/$(basename dist/Snapmockit-*-x86_64.flatpak)"

      - name: Show what is published
        run: ls -l site/ && du -sh site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Attach the signed bundle to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" signed/Snapmockit-*-x86_64.flatpak
