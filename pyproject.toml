[project]
name = "snapmockit"
dynamic = ["version"]
description = "Snapmockit: open-source multi-platform screenshot annotation and UI mockup tool"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Doug Bower" }]
requires-python = ">=3.12"
dependencies = [
    "PyQt6",
    "Pillow",
    "numpy",
    "send2trash>=2.1.0",
    "psutil>=7.2.2",
]

[project.urls]
Repository = "https://github.com/dbower44022/snapmockit"
Issues = "https://github.com/dbower44022/snapmockit/issues"

[dependency-groups]
dev = [
    "pytest",
    "pytest-qt",
    "ruff",
    "mypy",
    "python-docx>=1.2.0",
    "types-psutil>=7.2.2.20260906",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]
packaging = [
    "python-appimage>=1.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "snapmock/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["snapmock"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"snapmock/**/*.py" = ["N802"]  # Qt method overrides use camelCase

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["send2trash", "send2trash.*", "python_appimage", "python_appimage.*"]
ignore_missing_imports = true
